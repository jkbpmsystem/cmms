<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PPM</title>
<link rel="icon" type="image/png" href="img/cube.png">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#0a0f1c,#08101a 60%,#06101d);
  color:#d9f3ff;
  overflow-x:hidden;
}

/* ===== Layout ===== */
.wrapper{
  display:flex;
  height:100vh;
}

/* ===== Sidebar ===== */
.sidebar{
  width:90px;
  background:linear-gradient(180deg,#0c1624,#070e17);
  border-right:1px solid #00e5ff22;
  transition:0.3s;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:20px;
}

.sidebar.collapsed{
  width:65px;
}

.logo{
  font-size:22px;
  color:#00e5ff;
  margin-bottom:30px;
}

.side-item{
  width:100%;
  padding:12px 0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border-radius:15px;
  cursor:pointer;
  transition:0.3s;
  color:#7aa9c4;
  font-size:11px;
  gap:6px;
}

.side-item:hover{
  background:#00e5ff22;
  color:#00e5ff;
  transform:scale(1.1);
}

.side-item span{
  font-size:11px;
  opacity:0.7;
  transition:all 0.3s ease;
}

.sidebar.collapsed .side-item span{
  opacity:0;
  transform:translateY(-5px);
  pointer-events:none;
}

.sidebar.collapsed .side-item{
  gap:0;
}

.side-item{
  text-decoration:none;
  color:inherit;
}

/* ===== Main ===== */
.main{
  flex:1;
  padding:30px 40px;
}

/* ===== Topbar ===== */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.title{
  font-size:22px;
  font-weight:600;
  color:#00e5ff;
  letter-spacing:1px;
}
  
.profile{
  display:flex;
  align-items:center;
  gap:15px;
}

.logout-btn{
  padding:6px 14px;
  border-radius:20px;
  border:1px solid #00e5ff55;
  background:transparent;
  color:#00e5ff;
  cursor:pointer;
  transition:0.3s;
}

.logout-btn:hover{
  background:#00e5ff;
  color:#000;
}
/* ===== Header Section ===== */
.header-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.header-row h2{
  font-size:20px;
  font-weight:500;
}

.actions{
  display:flex;
  gap:10px;
}

.btn{
  padding:8px 14px;
  border-radius:8px;
  font-size:13px;
  border:1px solid #00e5ff33;
  background:#0c1624;
  color:#d8f3ff;
  cursor:pointer;
}

.btn-primary{
  background:#00e5ff;
  color:#000;
  border:none;
}

/* ===== Calendar Container ===== */
body{
background:#020617;
font-family:Segoe UI;
color:white;
}

.calendar-wrapper{
padding:20px;
}

.calendar-nav{
display:flex;
justify-content:center;
align-items:center;
gap:20px;
margin-bottom:20px;
}

.calendar-nav button{
background:#0f172a;
border:none;
color:white;
padding:8px 14px;
border-radius:6px;
cursor:pointer;
}

.calendar-header{
display:grid;
grid-template-columns:repeat(7,1fr);
opacity:0.6;
margin-bottom:10px;
text-align:center;
}

.calendar-grid{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:15px;
}

.day{
background:linear-gradient(180deg,#0f172a,#020617);
border-radius:12px;
padding:12px;
height:110px;
}

.date{
font-size:14px;
opacity:0.7;
margin-bottom:8px;
}

.event{
font-size:12px;
padding:6px 10px;
border-radius:6px;
display:inline-block;
margin-top:4px;
}

.blue{ background:#3b82f6; }
.green{ background:#22c55e; }
.orange{ background:#f59e0b; }
.red{ background:#ef4444; }

.day-name{
  text-align:center;
  font-size:12px;
  opacity:0.6;
  padding:5px 0;
}

.day{
  background:linear-gradient(145deg,#0f1b2d,#091321);
  border-radius:12px;
  padding:8px;
  min-height:100px;
  font-size:12px;
  position:relative;
}

.day-number{
  opacity:0.6;
  margin-bottom:6px;
}

.event{
  font-size:11px;
  padding:5px 6px;
  border-radius:6px;
  margin-top:4px;
  color:#fff;
}

.blue{background:#2196f3;}
.green{background:#4caf50;}
.orange{background:#ff9800;}
.red{background:#f44336;}

/* ===== Table ===== */
.table-box{
  background:#0b1421;
  border:1px solid #00e5ff22;
  border-radius:18px;
  padding:20px;
}

.table-title{
  margin-bottom:15px;
  font-size:16px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  text-align:left;
  font-size:13px;
  opacity:0.6;
  padding:12px 0;
  border-bottom:1px solid #00e5ff22;
}

td{
  padding:14px 0;
  border-bottom:1px solid #00e5ff11;
  font-size:14px;
}

.badge{
  padding:5px 10px;
  border-radius:15px;
  font-size:12px;
  color:#fff;
}

/*upcoming*/
#upcomingPM{
margin-top:10px;
}

.pm-item{
display:flex;
justify-content:space-between;
background:#0f172a;
padding:10px 12px;
border-radius:8px;
margin-bottom:8px;
}

.pm-date{
font-size:12px;
opacity:0.7;
}

.pm-title{
font-size:13px;
font-weight:500;
}

</style>
</head>

<body>

<div class="wrapper">

 <!-- Sidebar -->
<div class="sidebar">
  <div class="logo"><i class="fa-solid fa-cube"></i></div>

<a href="dashboard.html" class="side-item">
  <i class="fa-solid fa-house"></i>
  <span>Dashboard</span>
</a>

  <a href="asset-master.html" class="side-item">
    <i class="fa-solid fa-box"></i>
    <span>Assets</span>
  </a>

  <a href="dashboard.html" class="side-item">
    <i class="fa-solid fa-screwdriver-wrench"></i>
    <span>Warranty</span>
  </a>

  <a href="preventive-maintenance.html" class="side-item">
    <i class="fa-solid fa-calendar-days"></i>
    <span>PPM</span>
  </a>

  <a href="dashboard.html" class="side-item">
    <i class="fa-solid fa-chart-line"></i>
    <span>Reports</span>
  </a>
</div>

  <!-- Main -->
  <div class="main">

    <div class="topbar">
      <div class="title">CMMS SYSTEM</div>
          </div>

    <div class="header-row">
      <h2>PPM (Preventive Maintenance)</h2>
      <div class="actions">
        <button class="btn btn-primary">+ Add Schedule</button>
        <button class="btn">Filter</button>
        <button class="btn">Month</button>
      </div>
    </div>

    <!-- Calendar -->
 <div class="calendar-wrapper">

  <div class="calendar-nav">
    <button onclick="prevMonth()">◀</button>
    <h2 id="monthYear"></h2>
    <button onclick="nextMonth()">▶</button>
  </div>

  <div class="calendar-header">
    <span>S</span>
    <span>M</span>
    <span>T</span>
    <span>W</span>
    <span>T</span>
    <span>F</span>
    <span>S</span>
  </div>

  <div id="calendarGrid" class="calendar-grid"></div>

</div>
 
    <!-- Upcoming -->
    <div class="table-box">
      <div class="table-title">Upcoming PMs</div>
      <div id="upcomingPM"></div>
    </div>

<script>
  
const currentPage = window.location.pathname.split("/").pop();
const items = document.querySelectorAll(".side-item");

items.forEach(item=>{
  if(item.getAttribute("onclick")?.includes(currentPage)){
    item.classList.add("active");
  }
});

/*Calendar*/
let currentDate = new Date();

let events = {};

async function loadEvents(){

const res = await fetch("https://script.google.com/macros/s/AKfycbwHDAybRqO3zs6SXSaP3wQcdkNH9bU6v2QAGNy2yKT2GqfRRfcOczkCCI94oWxZEVcbPw/exec?action=getDW");

const data = await res.json();

data.forEach(row=>{

let color="blue";

if(row.status=="Completed") color="green";
if(row.status=="Inspection") color="orange";
if(row.status=="Breakdown") color="red";

if(!events[row.date]) events[row.date]=[];

events[row.date].push({
title:row.title,
color:color
});

});

renderCalendar();

}

function renderCalendar(){

const grid = document.getElementById("calendarGrid");
grid.innerHTML="";

const year = currentDate.getFullYear();
const month = currentDate.getMonth();

document.getElementById("monthYear").innerText =
currentDate.toLocaleString("default",{month:"long"})+" "+year;

const firstDay = new Date(year,month,1).getDay();
const daysInMonth = new Date(year,month+1,0).getDate();

for(let i=0;i<firstDay;i++){
grid.innerHTML += `<div></div>`;
}

for(let d=1; d<=daysInMonth; d++){

const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

let eventHTML="";

if(events[dateStr]){
events[dateStr].forEach(ev=>{
eventHTML += `<div class="event ${ev.color}">${ev.title}</div>`;
});
}

grid.innerHTML += `
<div class="day">
<div class="date">${d}</div>
${eventHTML}
</div>
`;

}

}

function prevMonth(){
currentDate.setMonth(currentDate.getMonth()-1);
renderCalendar();
}

function nextMonth(){
currentDate.setMonth(currentDate.getMonth()+1);
renderCalendar();
}

renderCalendar();

/*renderupcoming*/
async function loadUpcomingPM(){

const res = await fetch("https://script.google.com/macros/s/AKfycbwHDAybRqO3zs6SXSaP3wQcdkNH9bU6v2QAGNy2yKT2GqfRRfcOczkCCI94oWxZEVcbPw/exec?action=getDW");

const data = await res.json();

const container = document.getElementById("upcomingPM");

container.innerHTML="";

let today = new Date();

let upcoming = data.filter(r=>{
return new Date(r.date) >= today;
});

upcoming.sort((a,b)=>{
return new Date(a.date) - new Date(b.date);
});

upcoming.slice(0,5).forEach(pm=>{

let d = new Date(pm.date);

let html = `
<div class="pm-item">
<div class="pm-date">${d.toLocaleDateString()}</div>
<div class="pm-title">${pm.title}</div>
</div>
`;

container.innerHTML += html;

});

}

document.addEventListener("DOMContentLoaded", function(){

  loadUpcomingPM();

});

/*DW*/
function getDW(){

const sheet = SpreadsheetApp
.openById(SHEET_ID)
.getSheetByName(DW_SHEET);

const data = sheet.getDataRange().getValues();

let result = [];

for(let i=1;i<data.length;i++){

let asset = data[i][0];

// 1st PPM
if(data[i][1]){
result.push({
date: Utilities.formatDate(new Date(data[i][1]), "GMT+8", "yyyy-MM-dd"),
title: asset + " - 1st PM",
status: data[i][2] ? "Completed" : "Scheduled"
});
}

// 2nd PPM
if(data[i][3]){
result.push({
date: Utilities.formatDate(new Date(data[i][3]), "GMT+8", "yyyy-MM-dd"),
title: asset + " - 2nd PM",
status: data[i][4] ? "Completed" : "Scheduled"
});
}

// 3rd PPM
if(data[i][5]){
result.push({
date: Utilities.formatDate(new Date(data[i][5]), "GMT+8", "yyyy-MM-dd"),
title: asset + " - 3rd PM",
status: data[i][6] ? "Completed" : "Scheduled"
});
}

// 4th PPM
if(data[i][7]){
result.push({
date: Utilities.formatDate(new Date(data[i][7]), "GMT+8", "yyyy-MM-dd"),
title: asset + " - 4th PM",
status: data[i][8] ? "Completed" : "Scheduled"
});
}

}

return json(result);

}
  
</script>
