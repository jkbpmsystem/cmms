<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>MASTER ASSET</title>
    <link rel="icon" type="image/png" href="img/cube.png">

    <!-- FONT AWESOME -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0f1c, #08101a 60%, #06101d);
            color: #d9f3ff;
            overflow-x: hidden;
        }

        /* ===== Layout ===== */
        .wrapper {
            display: flex;
            height: 100vh;
        }

        /* ===== Sidebar ===== */
        .sidebar {
            width: 90px;
            background: linear-gradient(180deg, #0c1624, #070e17);
            border-right: 1px solid #00e5ff22;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }

        .sidebar.collapsed {
            width: 65px;
        }

        .logo {
            font-size: 22px;
            color: #00e5ff;
            margin-bottom: 30px;
        }

        .side-item {
            width: 100%;
            padding: 12px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            color: #7aa9c4;
            font-size: 11px;
            gap: 6px;
        }

        .side-item:hover {
            background: #00e5ff22;
            color: #00e5ff;
            transform: scale(1.1);
        }

        .side-item span {
            font-size: 11px;
            opacity: 0.7;
            transition: all 0.3s ease;
        }

        .sidebar.collapsed .side-item span {
            opacity: 0;
            transform: translateY(-5px);
            pointer-events: none;
        }

        .sidebar.collapsed .side-item {
            gap: 0;
        }

        .side-item {
            text-decoration: none;
            color: inherit;
        }

        /* ===== Main ===== */
        .main {
            flex: 1;
            padding: 30px 40px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-row h2 {
            font-size: 20px;
            font-weight: 500;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            border: 1px solid #00e5ff33;
            background: #0c1624;
            color: #d8f3ff;
            cursor: pointer;
        }

        .btn-primary {
            background: #00e5ff;
            color: #000;
            border: none;
        }

        /* ===== Topbar ===== */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 22px;
            font-weight: 600;
            color: #00e5ff;
            letter-spacing: 1px;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logout-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #00e5ff55;
            background: transparent;
            color: #00e5ff;
            cursor: pointer;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: #00e5ff;
            color: #000;
        }

        /* ===== KPI Cards ===== */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: linear-gradient(145deg, #111b2a, #0a1320);
            border: 1px solid #00e5ff22;
            padding: 20px;
            border-radius: 16px;
            transition: 0.3s;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 25px #00e5ff33;
        }

        .card i {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 14px;
            opacity: 0.7;
        }

        .card-value {
            font-size: 28px;
            font-weight: 600;
            margin-top: 8px;
        }

        .cyan {
            color: #00e5ff;
        }

        .yellow {
            color: #ffc107;
        }

        .red {
            color: #ff3d57;
        }

        .green {
            color: #00e676;
        }

        /* ===== Chart Section ===== */
        .chart-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .chart-box {
            background: #0b1421;
            border: 1px solid #00e5ff22;
            border-radius: 16px;
            padding: 20px;
        }

        .chart-title {
            margin-bottom: 15px;
            font-size: 15px;
            opacity: 0.8;
        }

        canvas {
            width: 100%;
            height: 220px;
            background: linear-gradient(145deg, #0e1a2c, #091321);
            border-radius: 12px;
        }

        /* ===== Table ===== */
        .table-box {
            background: #0b1421;
            border: 1px solid #00e5ff22;
            border-radius: 16px;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            font-size: 13px;
            opacity: 0.6;
            padding: 12px 0;
            border-bottom: 1px solid #00e5ff22;
        }

        td {
            padding: 14px 0;
            border-bottom: 1px solid #00e5ff11;
        }

        .status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        /* ===== MODAL ===== */

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(3px);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            width: 420px;
            background: linear-gradient(145deg, #111b2a, #0a1320);
            border: 1px solid #00e5ff22;
            border-radius: 15px;
            padding: 25px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: #00e5ff;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 13px;
            opacity: 0.7;
        }

        .form-group select {
            width: 100%;
            padding: 9px 10px;
            border-radius: 8px;
            border: 1px solid #00e5ff22;
            background: #0b1421;
            color: #fff;
            outline: none;
            font-size: 13px;
            appearance: none;
            cursor: pointer;
        }

        /* focus effect */
        .form-group select:focus {
            border: 1px solid #00e5ff;
            box-shadow: 0 0 8px #00e5ff44;
        }

        /* optional arrow styling */
        .form-group {
            position: relative;
        }

        .close-btn {
            cursor: pointer;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            font-size: 13px;
            opacity: 0.7;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: #0b1421;
            border: 1px solid #00e5ff22;
            border-radius: 8px;
            color: #fff;
        }

        .save-btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #00e5ff;
            color: #000;
            font-weight: 600;
            cursor: pointer;
        }

        .location-group {
            position: relative;
        }

        .suggestion-box {
            position: absolute;
            top: 65px;
            width: 100%;
            background: #0b1421;
            border: 1px solid #00e5ff22;
            border-radius: 8px;
            max-height: 150px;
            overflow-y: auto;
            z-index: 999;
        }

        .suggestion-item {
            padding: 8px 10px;
            cursor: pointer;
            font-size: 13px;
        }

        .suggestion-item:hover {
            background: #00e5ff22;
        }

        .valid {
            border: 1px solid #00e5ff;
            box-shadow: 0 0 8px #00e5ff55;
        }

        .invalid {
            border: 1px solid #ff4d4d;
            box-shadow: 0 0 8px #ff4d4d55;
        }

        #locationName {
            font-size: 12px;
            margin-top: 4px;
            display: block;
        }

        .progress {
            background: #ffc107;
            color: #000;
        }

        .overdue {
            background: #ff3d57;
            color: #fff;
        }

        .complete {
            background: #00e676;
            color: #000;
        }
    </style>
</head>

<body>

    <div class="wrapper">

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo"><i class="fa-solid fa-cube"></i></div>

            <a href="/cmms/dashboard.html" class="side-item">
                <i class="fa-solid fa-house"></i>
                <span>Dashboard</span>
            </a>

            <a href="/data asset/asset-master.html" class="side-item">
                <i class="fa-solid fa-box"></i>
                <span>Assets</span>
            </a>

            <a href="/cmms/dashboard.html" class="side-item">
                <i class="fa-solid fa-screwdriver-wrench"></i>
                <span>Warranty</span>
            </a>

            <a href="/cmms/preventive-maintenance.html" class="side-item">
                <i class="fa-solid fa-calendar-days"></i>
                <span>PPM</span>
            </a>

            <a href="/cmms/dashboard.html" class="side-item">
                <i class="fa-solid fa-chart-line"></i>
                <span>Reports</span>
            </a>
        </div>
        <!-- Main -->
        <div class="main">

            <div class="topbar">
                <div class="title">CMMS SYSTEM</div>
                <div class="profile">
                    <i class="fa-solid fa-user"></i>
                    <span id="userDisplay"></span>
                </div>
            </div>

            <div class="container">

                <!-- ACTION BAR -->
                <div class="card action-bar" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;">
                    <button class="btn" onclick="openModal()">Add Asset</button>

                   <input type="text" id="searchBox" placeholder="Search..." onkeyup="searchTable()">

                    <select id="filterDiscipline" onchange="filterTable()">
                        <option value="">All Discipline</option>
                    </select>

                    <select id="filterLocation" onchange="filterTable()">
                        <option value="">All Location</option>
                    </select>
                </div>

                <!-- TABLE -->
                <div class="card" style="max-height:500px;overflow:auto">
                    <table id="assetTable">
                        <thead>
                            <tr>
                                <th></th>
                                <th>ID</th>
                                <th>Asset No</th>
                                <th>Asset Name</th>
                                <th>Type Code</th>
                                <th>Description</th>
                                <th>Discipline</th>
                                <th>Location</th>
                                <th>Start Warranty</th>
                                <th>End Warranty</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">

                    <div id="assetTotal" style="font-size:13px;opacity:0.7;"></div>

                    <div id="pagination" style="display:flex;gap:6px;"></div>

</div>
                    
                </div>


            </div>
        </div>

        <script>
            /* ===== DISPLAY USER ===== */
            const user = localStorage.getItem("user") || "Guest";
            document.getElementById("userDisplay").innerText = user;

            const currentPage = window.location.pathname.split("/").pop();
            const items = document.querySelectorAll(".side-item");

            items.forEach(item => {
                if (item.getAttribute("onclick")?.includes(currentPage)) {
                    item.classList.add("active");
                }
            });

            document.querySelector(".logo").onclick = function() {
                document.getElementById("sidebar").classList.toggle("collapsed");
            }

            function openModal() {
                document.getElementById("assetModal").style.display = "flex";
            }

            function closeModal() {
                document.getElementById("assetModal").style.display = "none";
            }

const API_URL = "https://script.google.com/macros/s/AKfycbwHDAybRqO3zs6SXSaP3wQcdkNH9bU6v2QAGNy2yKT2GqfRRfcOczkCCI94oWxZEVcbPw/exec";

let assetData = [];
let filteredData = [];
let currentPage = 1;
const rowsPerPage = 15;


/* LOAD DATA FROM GOOGLE SHEET */

async function loadAssets(){

  const res = await fetch(API_URL + "?action=getAssets&t=" + Date.now());
  assetData = await res.json();

  filteredData = assetData;

  populateFilters();
  renderTable();
  renderPagination();

}

document.addEventListener("DOMContentLoaded", loadAssets);



/* RENDER TABLE */

function renderTable(){

  const tbody = document.querySelector("#assetTable tbody");
  tbody.innerHTML = "";

  const start = (currentPage-1) * rowsPerPage;
  const end = start + rowsPerPage;

  const pageData = filteredData.slice(start,end);

  pageData.forEach(asset => {

    const row = document.createElement("tr");

    row.innerHTML = `
      <td></td>
      <td>${asset.id || ""}</td>
      <td>${asset.assetNo || ""}</td>
      <td>${asset.assetName || ""}</td>
      <td>${asset.typeCode || ""}</td>
      <td>${asset.description || ""}</td>
      <td>${asset.discipline || ""}</td>
      <td>${asset.location || ""}</td>
      <td>${asset.startWarranty || ""}</td>
      <td>${asset.endWarranty || ""}</td>
    `;

    tbody.appendChild(row);

  });

  document.getElementById("assetTotal").innerHTML =
  `Showing ${(start+1)}-${Math.min(end,filteredData.length)} of ${filteredData.length} assets`;

}



/* PAGINATION */

function renderPagination(){

  const pageBox = document.getElementById("pagination");
  pageBox.innerHTML = "";

  const totalPages = Math.ceil(filteredData.length / rowsPerPage);

  for(let i=1;i<=totalPages;i++){

    const btn = document.createElement("button");

    btn.innerText = i;
    btn.className = "btn";

    if(i===currentPage){
      btn.style.background="#00e5ff";
      btn.style.color="#000";
    }

    btn.onclick = ()=>{
      currentPage = i;
      renderTable();
      renderPagination();
    };

    pageBox.appendChild(btn);

  }

}



/* SEARCH */

function searchTable(){

  const keyword = document.getElementById("searchBox").value.toLowerCase();

  filteredData = assetData.filter(a =>
      Object.values(a).join(" ").toLowerCase().includes(keyword)
  );

  currentPage = 1;

  renderTable();
  renderPagination();
}



/* FILTER */

function filterTable(){

  const discipline = document.getElementById("filterDiscipline").value;
  const location = document.getElementById("filterLocation").value;

  filteredData = assetData.filter(a =>

      (discipline==="" || a.discipline===discipline) &&
      (location==="" || a.location===location)

  );

  currentPage = 1;

  renderTable();
  renderPagination();
}



/* AUTO POPULATE FILTER */

function populateFilters(){

  const disciplineSet = new Set();
  const locationSet = new Set();

  assetData.forEach(a=>{
    disciplineSet.add(a.discipline);
    locationSet.add(a.location);
  });

  const disciplineSelect = document.getElementById("filterDiscipline");
  const locationSelect = document.getElementById("filterLocation");

  disciplineSet.forEach(d=>{
    const opt = document.createElement("option");
    opt.value = d;
    opt.textContent = d;
    disciplineSelect.appendChild(opt);
  });

  locationSet.forEach(l=>{
    const opt = document.createElement("option");
    opt.value = l;
    opt.textContent = l;
    locationSelect.appendChild(opt);
  });

}
</script>

                        </div>

                        </div>

                        </div>

                        <div class="form-group">
                            <label>Supplier</label>
                            <input type="text" placeholder="Enter supplier"required>
                        </div>

                        <div class="form-group">
                            <label>Supplier Contact</label>
                            <input type="text" placeholder="Enter supplier"required>
                        </div>

                        <div class="form-group">
                            <label>Start Date</label>
                            <input type="date"required>
                        </div>

                        <div class="form-group">
                            <label>End Date</label>
                            <input type="date"required>
                        </div>

                        <div class="form-group">
                            <label>Frequency PPM by Vendor *base on T&C*</label>
                            <input type="date"required>
                        </div>

                    </div>

                    <button class="save-btn">Save Asset</button>

                </div>

            </div>

        </div>
</body>


</html>
