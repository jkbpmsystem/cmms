<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#0a0f1c,#08101a 60%,#06101d);
  color:#d9f3ff;
  overflow-x:hidden;
}

/* ===== Layout ===== */
.wrapper{
  display:flex;
  height:100vh;
}

/* ===== Sidebar ===== */
.sidebar{
  width:90px;
  background:linear-gradient(180deg,#0c1624,#070e17);
  border-right:1px solid #00e5ff22;
  transition:0.3s;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:20px;
}

.sidebar.collapsed{
  width:65px;
}

.logo{
  font-size:22px;
  color:#00e5ff;
  margin-bottom:30px;
}

.side-item{
  width:100%;
  padding:12px 0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border-radius:15px;
  cursor:pointer;
  transition:0.3s;
  color:#7aa9c4;
  font-size:11px;
  gap:6px;
}

.side-item:hover{
  background:#00e5ff22;
  color:#00e5ff;
  transform:scale(1.1);
}

.side-item span{
  font-size:11px;
  opacity:0.7;
  transition:all 0.3s ease;
}

.sidebar.collapsed .side-item span{
  opacity:0;
  transform:translateY(-5px);
  pointer-events:none;
}

.sidebar.collapsed .side-item{
  gap:0;
}

.side-item{
  text-decoration:none;
  color:inherit;
}

/* ===== Main ===== */
.main{
  flex:1;
  padding:30px 40px;
}

/* ===== Topbar ===== */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.title{
  font-size:22px;
  font-weight:600;
  color:#00e5ff;
  letter-spacing:1px;
}
  
.profile{
  display:flex;
  align-items:center;
  gap:15px;
}

.logout-btn{
  padding:6px 14px;
  border-radius:20px;
  border:1px solid #00e5ff55;
  background:transparent;
  color:#00e5ff;
  cursor:pointer;
  transition:0.3s;
}

.logout-btn:hover{
  background:#00e5ff;
  color:#000;
}
/* ===== Header Section ===== */
.header-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.header-row h2{
  font-size:20px;
  font-weight:500;
}

.actions{
  display:flex;
  gap:10px;
}

.btn{
  padding:8px 14px;
  border-radius:8px;
  font-size:13px;
  border:1px solid #00e5ff33;
  background:#0c1624;
  color:#d8f3ff;
  cursor:pointer;
}

.btn-primary{
  background:#00e5ff;
  color:#000;
  border:none;
}

/*table*/
/* ===== Table Container ===== */
.table-box{
  background:#0b1421;
  border:1px solid #00e5ff22;
  border-radius:18px;
  padding:20px;
  margin-top:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

/* ===== Title ===== */
.table-title{
  font-size:16px;
  margin-bottom:15px;
  color:#00e5ff;
  letter-spacing:0.5px;
}

/* ===== Table ===== */
table{
  width:100%;
  border-collapse:collapse;
}

/* Header */
th{
  text-align:left;
  font-size:13px;
  padding:12px 10px;
  border-bottom:1px solid #00e5ff33;
  color:#7dd3fc;
  font-weight:500;
}

/* Row */
td{
  padding:12px 10px;
  font-size:13px;
  border-bottom:1px solid #00e5ff11;
  color:#d8f3ff;
}

/* Hover Effect */
tbody tr:hover{
  background:#00e5ff0f;
  transition:0.2s;
}

/* Last row remove border */
tbody tr:last-child td{
  border-bottom:none;
}

.badge{
  padding:4px 10px;
  border-radius:12px;
  font-size:11px;
  font-weight:500;
}

.badge-active{
  background:#22c55e;
  color:#fff;
}

.badge-expired{
  background:#ef4444;
  color:#fff;
}

.badge-warning{
  background:#f59e0b;
  color:#fff;
}

/*pagination*/
.pagination{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
margin-top:10px;
}

.pagination button{
background:#0f172a;
border:1px solid #00e5ff33;
color:#00e5ff;
padding:4px 10px;
border-radius:6px;
cursor:pointer;
}

.pagination button:hover{
background:#00e5ff22;
}

max-width:950px;
}

.asset-card b{

color:#7aa9c4;

.asset-card div{

font-weight:500;
color:#d9f3ff;

position:fixed;

left:0;

background:rgba(0,0,0,0.6);

z-index:1000;

 <!-- Sidebar -->

  <!-- Main -->
  <div class="main">

    <div class="header-row">
      <h2>Status Warranty</h2>
      <div class="actions">
  <button class="btn" onclick="exportPostWarranty()">Export Post Warranty</button>
</div>
    </div>
   
    <!--Table-->
<div class="table-box">

<div class="table-title">During Warranty</div>

<table>
<thead>
<tr>
<th>ID</th>
<th>Equipment</th>
<th>Start Date</th>

<tbody id="duringWarranty"></tbody>

<div class="table-box" style="margin-top:30px;">

<table>
<thead>
<tr>
<th>ID</th>
<th>Equipment</th>
<th>Supplier</th>

<th>End Date</th>

</tr>
</thead>

<tbody id="postWarranty"></tbody>

<script>

let duringData = [];
let postData = [];
let assetData = [];
  
let duringPage = 1;
let postPage = 1;

const perPage = 5;


/*load data asset*/
async function loadWarranty(){

showLoading();

const data = await fetchData("https://script.google.com/macros/s/AKfycbwHDAybRqO3zs6SXSaP3wQcdkNH9bU6v2QAGNy2yKT2GqfRRfcOczkCCI94oWxZEVcbPw/exec?action=getAssets");

if(!data){

return;
}

renderWarranty(data);

hideLoading();
assetData = data;
  
}

/*pisah warranty*/
function renderWarranty(data){

const today = new Date();

duringData = [];
postData = [];

data.forEach(asset=>{

const end = new Date(asset.endDate);

const diffTime = end - today;
const daysLeft = Math.ceil(diffTime / (1000*60*60*24));

let statusClass="";
let statusText="";

if(daysLeft < 0){

statusClass="badge-expired";
statusText="Expired";

postData.push({...asset,daysLeft,statusClass,statusText});

}else if(daysLeft <= 90){

statusClass="badge-warning";
statusText="Expiring Soon";

duringData.push({...asset,daysLeft,statusClass,statusText});

}else{

statusClass="badge-active";
statusText="Active";

duringData.push({...asset,daysLeft,statusClass,statusText});

}

});

renderDuringTable();
renderPostTable();

}

/*export*/
function exportPostWarranty(){

const today = new Date();

let exportData = [];

assetData.forEach(asset=>{

const end = new Date(asset.endDate);

if(end < today){

exportData.push({
ID: asset.id,
Equipment: asset.equipmentName || "-",
StartDate: asset.startDate || "-",
EndDate: asset.endDate || "-",
Status: "Expired"
});

}

});

/* convert to CSV */
let csv = "ID,Equipment,Start Date,End Date,Status\n";

exportData.forEach(r=>{
csv += `${r.ID},"${r.Equipment}",${r.StartDate},${r.EndDate},${r.Status}\n`;
});

/* download */
const blob = new Blob([csv],{type:"text/csv"});
const url = URL.createObjectURL(blob);

const a = document.createElement("a");
a.href = url;
a.download = "Post_Warranty_Report.csv";
a.click();

}


function formatDate(dateStr){

if(!dateStr) return "-";

const d = new Date(dateStr);

const day = String(d.getDate()).padStart(2,"0");
const month = String(d.getMonth()+1).padStart(2,"0");
const year = d.getFullYear();

return `${day}/${month}/${year}`;

}

/*render table*/
function renderDuringTable(){

const table = document.getElementById("duringWarranty");
table.innerHTML="";

const start = (duringPage-1)*perPage;
const end = start+perPage;

const pageData = duringData.slice(start,end);

pageData.forEach((asset,index)=>{

const realIndex = start + index;

table.innerHTML += `
<tr>
<td onclick="showDetailById('${asset.id}')" style="cursor:pointer;color:#00e5ff;">
${asset.id}
</td>
<td>${asset.equipmentName || "-"}</td>
<td>${formatDate(asset.startDate)}</td>
<td>${formatDate(asset.endDate)}</td>
<td>${asset.daysLeft} days</td>
<td><span class="badge ${asset.statusClass}">${asset.statusText}</span></td>
</tr>
`;
});
renderDuringPagination();
}

/*rendertablepost*/
function renderPostTable(){

const table = document.getElementById("postWarranty");
table.innerHTML="";

const start = (postPage-1)*perPage;
const end = start+perPage;

const pageData = postData.slice(start,end);

pageData.forEach(asset=>{

table.innerHTML += `
<tr>
<td>${asset.id}</td>
<td>${asset.equipmentName || "-"}</td>
<td>${asset.supplier || "-"}</td>
<td>${formatDate(asset.startDate)}</td>
<td>${formatDate(asset.endDate)}</td>
<td><span class="badge badge-expired">Expired</span></td>
</tr>
`;

});

renderPostPagination();

}

/*paginationdw*/
function renderDuringPagination(){

const container = document.getElementById("duringWarranty");

const totalPages = Math.ceil(duringData.length/perPage);

let html=`<tr><td colspan="6">
<div class="pagination">`;

if(duringPage>1){
html+=`<button onclick="changeDuringPage(${duringPage-1})">Prev</button>`;
}

html+=` Page ${duringPage} / ${totalPages} `;

if(duringPage<totalPages){
html+=`<button onclick="changeDuringPage(${duringPage+1})">Next</button>`;
}

html+=`</div></td></tr>`;

container.innerHTML+=html;

}

function changeDuringPage(p){

duringPage=p;
renderDuringTable();

}

/*paginationpw*/
function renderPostPagination(){

const container = document.getElementById("postWarranty");

const totalPages = Math.ceil(postData.length/perPage);

let html=`<tr><td colspan="7">
<div class="pagination">`;

if(postPage>1){
html+=`<button onclick="changePostPage(${postPage-1})">Prev</button>`;
}

html+=` Page ${postPage} / ${totalPages} `;

if(postPage<totalPages){
html+=`<button onclick="changePostPage(${postPage+1})">Next</button>`;
}

html+=`</div></td></tr>`;

container.innerHTML+=html;

}

function changePostPage(p){

postPage=p;
renderPostTable();

}
